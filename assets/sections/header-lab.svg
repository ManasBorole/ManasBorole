<svg viewBox="0 0 1000 116" width="1000" height="116" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech Laboratory">
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D141A"/>
      <stop offset="1" stop-color="#0A0E12"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9C0"/>
      <stop offset="1" stop-color="#7FE9DF"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9C0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4CC9C0" stop-opacity="1"/>
      <stop offset="1" stop-color="#E9A85A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  
  <style>
    .k{font:600 13px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;letter-spacing:6px;fill:#E9A85A}
    .t{font:800 42px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:2px;fill:#E8EEEC}
    .bar{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .dash{stroke-dasharray:6 10;animation:march 8s linear infinite}
    @keyframes march{to{stroke-dashoffset:-160}}
    .node{animation:np 2.6s ease-in-out infinite}
    @keyframes np{0%,100%{r:3;opacity:.6}50%{r:5;opacity:1}}
  </style>

  <rect width="1000" height="116" fill="#0A0E12"/>
  <g opacity="0.04"><rect x="0" y="0" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="4" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="8" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="12" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="16" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="20" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="24" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="28" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="32" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="36" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="40" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="44" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="48" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="52" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="56" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="60" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="64" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="68" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="72" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="76" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="80" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="84" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="88" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="92" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="96" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="100" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="104" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="108" width="1000" height="1" fill="#4CC9C0"/><rect x="0" y="112" width="1000" height="1" fill="#4CC9C0"/></g>
  <rect class="bar" x="0" y="20" width="6" height="76" rx="3" fill="url(#tealGrad)" filter="url(#glow)"/>
  <text class="k" x="28" y="46">06 // INVENTORY</text>
  <text class="t" x="26" y="88" filter="url(#glow)">Tech Laboratory</text>
  <line class="dash" x1="28" y1="104" x2="972" y2="104" stroke="#20303A" stroke-width="1.5"/>
  <circle class="node" cx="972" cy="104" r="4" fill="#E9A85A" filter="url(#glow)"/>
  <circle class="node" cx="28"  cy="104" r="4" fill="#4CC9C0" style="animation-delay:1.3s" filter="url(#glow)"/>
</svg>

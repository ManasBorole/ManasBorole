<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 300" width="840" height="300"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}.sig{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:3px;fill:#7E938C}.sweep{animation:sweep 7s linear infinite}@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(600px)}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.bob{animation:bob 1.1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}.wave{animation:wv 1.4s ease-in-out infinite}@keyframes wv{50%{transform:rotate(-28deg)}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D141A"/><stop offset="1" stop-color="#0A0E12"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".025"/></pattern></defs><clipPath id="pc"><rect width="840" height="300" rx="10"/></clipPath><g clip-path="url(#pc)"><rect width="840" height="300" rx="10" fill="url(#bg)"/><rect width="840" height="300" rx="10" fill="url(#scan)"/><rect class="sweep" x="0" y="0" width="840" height="40" fill="#4CC9C0" opacity=".025"/><path d="M14,32 L14,14 L32,14" fill="none" stroke="#4CC9C0" stroke-width="1.6"/><path d="M826,32 L826,14 L808,14" fill="none" stroke="#4CC9C0" stroke-width="1.6"/><path d="M14,268 L14,286 L32,286" fill="none" stroke="#E9A85A" stroke-width="1.6"/><path d="M826,268 L826,286 L808,286" fill="none" stroke="#E9A85A" stroke-width="1.6"/><text x="36" y="38" class="sig">ARRIVALS  /  TERMINAL M</text><text x="804" y="38" class="sig" text-anchor="end">GATE 01</text><g transform="translate(70,40) scale(.92)"><ellipse cx="110" cy="252" rx="60" ry="8" fill="#4CC9C0" opacity=".18" filter="url(#soft)"/><g class="bob"><path d="M60 250 q0 -70 50 -74 q50 4 50 74 Z" fill="#16232B" stroke="#4CC9C0" stroke-opacity=".7"/><circle class="pulse" cx="110" cy="205" r="6" fill="#E9A85A" filter="url(#glow)"/><line x1="70" y1="170" x2="70" y2="215" stroke="#4CC9C0" stroke-width="6" stroke-linecap="round"/><g class="wave" style="transform-origin:150px 172px"><line x1="150" y1="172" x2="176" y2="128" stroke="#4CC9C0" stroke-width="6" stroke-linecap="round"/></g><rect x="76" y="70" width="68" height="82" rx="24" fill="#121A20" stroke="#4CC9C0" stroke-opacity=".8"/><rect class="pulse" x="86" y="100" width="48" height="12" rx="6" fill="#4CC9C0" filter="url(#glow)"/><circle cx="98" cy="106" r="2.5" fill="#0A0E12"/><circle cx="122" cy="106" r="2.5" fill="#0A0E12"/><line x1="110" y1="70" x2="110" y2="54" stroke="#4CC9C0" stroke-width="2"/><circle class="pulse" cx="110" cy="50" r="4" fill="#E9A85A" filter="url(#glow)"/></g></g><text x="330" y="132" font-size="30" font-weight="800" fill="#E8EEEC" class="m" letter-spacing="2" filter="url(#glow)">ARRIVALS</text><text x="332" y="166" font-size="15" fill="#7E938C">If you are building something or stuck on something hard,</text><text x="332" y="188" font-size="15" fill="#7E938C">this is where you land. Say hi.</text><circle cx="340" cy="222" r="4" fill="#4CC9C0" class="pulse" filter="url(#glow)"/><text x="354" y="227" class="m" font-size="13" letter-spacing="2" fill="#4CC9C0">YOU  /  ON TIME</text></g></svg>
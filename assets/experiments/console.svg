<svg viewBox="0 0 1000 320" width="1000" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Active research console">
  <style>:root{--bg:#0A0E12;--bg2:#0D141A;--surf:#121A20;--surf2:#16232B;--teal:#4CC9C0;--tealg:#7FE9DF;--teald:#2C6E6A;--amber:#E9A85A;--amberg:#F4C889;--text:#E8EEEC;--mute:#7E938C;--line:#20303A}@media(prefers-color-scheme:light){:root{--bg:#F6F8FA;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F5F8;--teal:#0E7C74;--tealg:#0E8C82;--teald:#8FB7B3;--amber:#B9761A;--amberg:#C98A2A;--text:#1F2328;--mute:#57606A;--line:#D0D7DE}.scanpanel{opacity:0}}</style>
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg2)"/>
      <stop offset="1" stop-color="var(--bg)"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)"/>
      <stop offset="1" stop-color="var(--tealg)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="var(--teal)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .hdr{font:700 15px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;letter-spacing:3px;fill:var(--amber)}
    .lbl{font:500 15px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;fill:var(--text)}
    .pct{font:600 13px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;fill:var(--mute)}
    .fill{animation:load 2.4s ease-out forwards;transform-origin:left}
    @keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
    .dot{animation:p 1.8s ease-in-out infinite}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
  </style>

  <rect width="1000" height="320" rx="14" fill="var(--bg)" stroke="var(--line)"/>
  <g class="scanpanel" opacity="0.03"><rect x="0" y="0" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="4" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="8" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="12" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="16" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="20" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="24" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="28" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="32" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="36" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="40" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="44" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="48" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="52" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="56" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="60" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="64" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="68" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="72" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="76" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="80" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="84" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="88" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="92" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="96" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="100" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="104" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="108" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="112" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="116" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="120" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="124" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="128" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="132" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="136" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="140" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="144" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="148" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="152" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="156" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="160" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="164" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="168" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="172" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="176" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="180" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="184" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="188" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="192" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="196" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="200" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="204" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="208" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="212" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="216" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="220" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="224" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="228" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="232" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="236" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="240" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="244" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="248" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="252" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="256" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="260" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="264" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="268" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="272" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="276" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="280" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="284" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="288" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="292" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="296" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="300" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="304" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="308" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="312" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="316" width="1000" height="1" fill="var(--teal)"/></g>
  <circle cx="26" cy="26" r="5" fill="#ff5f56"/><circle cx="46" cy="26" r="5" fill="var(--amber)"/><circle cx="66" cy="26" r="5" fill="var(--teal)"/>
  <text class="hdr" x="92" y="31">research://active</text>
  <line x1="0" y1="52" x2="1000" y2="52" stroke="var(--line)"/>
  <text class="lbl" x="40" y="80" fill="var(--amber)" font-size="13">ACTIVE RESEARCH<tspan class="cur"> &#9608;</tspan></text>
  <circle class="dot" cx="40" cy="92" r="4" fill="var(--amber)" style="animation-delay:-0.0s"/><text class="lbl" x="56" y="96">Team workspace + operational agent</text><rect x="700" y="86" width="220" height="8" rx="4" fill="var(--surf2)"/><rect class="fill" x="700" y="86" width="220" height="8" rx="4" fill="var(--amber)" style="transform:scaleX(0.60);animation-delay:0.2s" filter="url(#glow)"/><text class="pct" x="932" y="96">60%</text><circle class="dot" cx="40" cy="144" r="4" fill="var(--teal)" style="animation-delay:-0.4s"/><text class="lbl" x="56" y="148">Decisions and actions as a durable record</text><rect x="700" y="138" width="220" height="8" rx="4" fill="var(--surf2)"/><rect class="fill" x="700" y="138" width="220" height="8" rx="4" fill="var(--teal)" style="transform:scaleX(0.52);animation-delay:0.4s" filter="url(#glow)"/><text class="pct" x="932" y="148">52%</text><circle class="dot" cx="40" cy="196" r="4" fill="var(--teal)" style="animation-delay:-0.8s"/><text class="lbl" x="56" y="200">Agent execution across business tools</text><rect x="700" y="190" width="220" height="8" rx="4" fill="var(--surf2)"/><rect class="fill" x="700" y="190" width="220" height="8" rx="4" fill="var(--teal)" style="transform:scaleX(0.44);animation-delay:0.6000000000000001s" filter="url(#glow)"/><text class="pct" x="932" y="200">44%</text><circle class="dot" cx="40" cy="248" r="4" fill="var(--amber)" style="animation-delay:-1.2000000000000002s"/><text class="lbl" x="56" y="252">Voice-native agents</text><rect x="700" y="242" width="220" height="8" rx="4" fill="var(--surf2)"/><rect class="fill" x="700" y="242" width="220" height="8" rx="4" fill="var(--amber)" style="transform:scaleX(0.70);animation-delay:0.8s" filter="url(#glow)"/><text class="pct" x="932" y="252">70%</text>
</svg>

  <rect x="34" y="34" width="932" height="48" rx="12" fill="#16232B" stroke="#20303A"/><rect class="tick" x="34" y="34" width="4" height="48" rx="2" fill="#4CC9C0" filter="url(#glow)"/><text class="idx" x="56" y="62" fill="#4CC9C0">01</text><text class="pr" x="100" y="63">Understand the problem before writing the solution.</text><rect x="34" y="96" width="932" height="48" rx="12" fill="#16232B" stroke="#20303A"/><rect class="tick" x="34" y="96" width="4" height="48" rx="2" fill="#E9A85A" filter="url(#glow)"/><text class="idx" x="56" y="124" fill="#E9A85A">02</text><text class="pr" x="100" y="125">Prefer clarity to cleverness. The next reader is you.</text><rect x="34" y="158" width="932" height="48" rx="12" fill="#16232B" stroke="#20303A"/><rect class="tick" x="34" y="158" width="4" height="48" rx="2" fill="#4CC9C0" filter="url(#glow)"/><text class="idx" x="56" y="186" fill="#4CC9C0">03</text><text class="pr" x="100" y="187">Reliability is designed in, not added on later.</text><rect x="34" y="220" width="932" height="48" rx="12" fill="#16232B" stroke="#20303A"/><rect class="tick" x="34" y="220" width="4" height="48" rx="2" fill="#E9A85A" filter="url(#glow)"/><text class="idx" x="56" y="248" fill="#E9A85A">04</text><text class="pr" x="100" y="249">Ship with intention. Every change should earn its place.</text><rect x="34" y="282" width="932" height="48" rx="12" fill="#16232B" stroke="#20303A"/><rect class="tick" x="34" y="282" width="4" height="48" rx="2" fill="#4CC9C0" filter="url(#glow)"/><text class="idx" x="56" y="310" fill="#4CC9C0">05</text><text class="pr" x="100" y="311">Simple systems outlast complex ones. Complexity is a cost paid forever.</text>
</svg>

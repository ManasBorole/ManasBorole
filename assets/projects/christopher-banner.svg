<svg viewBox="0 0 1000 200" width="1000" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Christopher project banner">
  <style>:root{--bg:#0A0E12;--bg2:#0D141A;--surf:#121A20;--surf2:#16232B;--teal:#4CC9C0;--tealg:#7FE9DF;--teald:#2C6E6A;--amber:#E9A85A;--amberg:#F4C889;--text:#E8EEEC;--mute:#7E938C;--line:#20303A}@media(prefers-color-scheme:light){:root{--bg:#F6F8FA;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F5F8;--teal:#0E7C74;--tealg:#0E8C82;--teald:#8FB7B3;--amber:#B9761A;--amberg:#C98A2A;--text:#1F2328;--mute:#57606A;--line:#D0D7DE}.scanpanel{opacity:0}}</style>
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg2)"/>
      <stop offset="1" stop-color="var(--bg)"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)"/>
      <stop offset="1" stop-color="var(--tealg)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="var(--teal)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .code{font:600 13px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;letter-spacing:5px;fill:var(--amber)}
    .ttl{font:800 40px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:1px;fill:var(--text)}
    .sub{font:400 16px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:var(--mute)}
    .live{animation:bp 1.8s ease-in-out infinite}
    @keyframes bp{0%,100%{opacity:.4;r:5}50%{opacity:1;r:7}}
    .scan{animation:sc 7s linear infinite}
    @keyframes sc{0%{transform:translateX(-1000px)}100%{transform:translateX(1000px)}}
  </style>

  <rect x="1" y="1" width="998" height="198" rx="16" fill="var(--surf)" stroke="var(--line)"/>
  <rect x="1" y="1" width="998" height="198" rx="16" fill="url(#bgGrad)" opacity="0.5"/>
  <g class="scanpanel" opacity="0.05"><rect x="0" y="0" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="4" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="8" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="12" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="16" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="20" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="24" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="28" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="32" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="36" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="40" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="44" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="48" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="52" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="56" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="60" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="64" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="68" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="72" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="76" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="80" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="84" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="88" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="92" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="96" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="100" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="104" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="108" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="112" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="116" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="120" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="124" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="128" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="132" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="136" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="140" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="144" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="148" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="152" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="156" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="160" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="164" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="168" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="172" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="176" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="180" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="184" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="188" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="192" width="1000" height="1" fill="var(--teal)"/><rect x="0" y="196" width="1000" height="1" fill="var(--teal)"/></g>
  <rect class="scan" x="0" y="0" width="200" height="200" fill="var(--amber)" opacity="0.04"/>
  <rect x="0" y="0" width="5" height="200" fill="var(--amber)" filter="url(#glow)"/>
  <!-- corner ticks -->
  <path d="M978 16 h6 v6 M978 184 h6 v-6" stroke="var(--amber)" stroke-width="2" fill="none" opacity="0.7"/>
  <text class="code" x="34" y="46">PROJECT // 002</text>
  <text class="ttl"  x="32" y="92" filter="url(#glow)">Christopher</text>
  <text class="sub"  x="34" y="122">A voice tutor you can actually talk to, out loud, in real time.</text>
  <g transform="translate(820,38)">
    <circle class="live" cx="8" cy="6" r="6" fill="var(--amber)" filter="url(#glow)"/>
    <text x="24" y="11" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12" letter-spacing="2" fill="var(--amber)">LIVE</text>
  </g>
  <g transform="translate(34,150)"><rect width="74" height="26" rx="13" fill="var(--surf2)" stroke="var(--line)"/><text x="37" y="17" font="500 12px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" fill="var(--mute)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12">WebRTC</text></g><g transform="translate(118,150)"><rect width="128" height="26" rx="13" fill="var(--surf2)" stroke="var(--line)"/><text x="64" y="17" font="500 12px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" fill="var(--mute)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12">Realtime API</text></g><g transform="translate(256,150)"><rect width="110" height="26" rx="13" fill="var(--surf2)" stroke="var(--line)"/><text x="55" y="17" font="500 12px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" fill="var(--mute)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12">180+ langs</text></g><g transform="translate(376,150)"><rect width="74" height="26" rx="13" fill="var(--surf2)" stroke="var(--line)"/><text x="37" y="17" font="500 12px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" fill="var(--mute)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12">Memory</text></g><g transform="translate(460,150)"><rect width="56" height="26" rx="13" fill="var(--surf2)" stroke="var(--line)"/><text x="28" y="17" font="500 12px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" fill="var(--mute)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12">Live</text></g>
</svg>

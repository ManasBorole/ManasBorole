<svg viewBox="0 0 220 260" width="220" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="companion wave">
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D141A"/>
      <stop offset="1" stop-color="#0A0E12"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9C0"/>
      <stop offset="1" stop-color="#7FE9DF"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9C0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4CC9C0" stop-opacity="1"/>
      <stop offset="1" stop-color="#E9A85A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .visor{animation:sc 3s ease-in-out infinite}
    @keyframes sc{0%,100%{opacity:.55}50%{opacity:1}}
    .core{animation:cp 2.2s ease-in-out infinite}
    @keyframes cp{0%,100%{opacity:.5;r:5}50%{opacity:1;r:7}}
    .float{animation:fl 4s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .blip{animation:bp 1.6s ease-in-out infinite}
    @keyframes bp{0%,100%{opacity:.2}50%{opacity:1}}
  </style>

  <g class="float">
    <!-- ground glow -->
    <ellipse cx="110" cy="248" rx="60" ry="8" fill="#4CC9C0" opacity="0.15" filter="url(#softGlow)"/>
    <!-- shoulders / body -->
    <path d="M60 250 q0 -70 50 -74 q50 4 50 74 Z" fill="#16232B" stroke="#4CC9C0" stroke-opacity="0.7"/>
    <circle class="core" cx="110" cy="205" r="6" fill="#E9A85A" filter="url(#glow)"/>
    <line x1="70" y1="170" x2="70" y2="215" stroke="#4CC9C0" stroke-width="6" stroke-linecap="round"/><g class="float" style="transform-origin:150px 170px"><line x1="150" y1="170" x2="175" y2="120" stroke="#4CC9C0" stroke-width="6" stroke-linecap="round"/><circle cx="177" cy="116" r="6" fill="#4CC9C0"/></g>
    <!-- head -->
    <g transform="translate(0,0)">
      <rect x="76" y="70" width="68" height="82" rx="24" fill="#121A20" stroke="#4CC9C0" stroke-opacity="0.8"/>
      <rect x="76" y="70" width="68" height="82" rx="24" fill="none" stroke="#7FE9DF" stroke-opacity="0.25"/>
      <!-- visor slit -->
      <rect class="visor" x="86" y="100" width="48" height="12" rx="6" fill="#4CC9C0" filter="url(#glow)"/>
      <circle class="visor" cx="98" cy="106" r="2.5" fill="#0A0E12"/>
      <circle class="visor" cx="122" cy="106" r="2.5" fill="#0A0E12"/>
      <!-- antenna -->
      <line x1="110" y1="70" x2="110" y2="54" stroke="#4CC9C0" stroke-width="2"/>
      <circle class="core" cx="110" cy="50" r="4" fill="#E9A85A" filter="url(#glow)"/>
    </g>
    <text x="150" y="90" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="13" fill="#E9A85A" class="blip">bye</text>
  </g>
</svg>

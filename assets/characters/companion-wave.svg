<svg viewBox="0 0 220 260" width="220" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="companion wave">
  <style>:root{--bg:#0A0E12;--bg2:#0D141A;--surf:#121A20;--surf2:#16232B;--teal:#4CC9C0;--tealg:#7FE9DF;--teald:#2C6E6A;--amber:#E9A85A;--amberg:#F4C889;--text:#E8EEEC;--mute:#7E938C;--line:#20303A}@media(prefers-color-scheme:light){:root{--bg:#F6F8FA;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F5F8;--teal:#0E7C74;--tealg:#0E8C82;--teald:#8FB7B3;--amber:#B9761A;--amberg:#C98A2A;--text:#1F2328;--mute:#57606A;--line:#D0D7DE}.scanpanel{opacity:0}}</style>
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg2)"/>
      <stop offset="1" stop-color="var(--bg)"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)"/>
      <stop offset="1" stop-color="var(--tealg)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="var(--teal)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .visor{animation:sc 3s ease-in-out infinite}
    @keyframes sc{0%,100%{opacity:.55}50%{opacity:1}}
    .core{animation:cp 2.2s ease-in-out infinite}
    @keyframes cp{0%,100%{opacity:.5;r:5}50%{opacity:1;r:7}}
    .float{animation:fl 4s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .blip{animation:bp 1.6s ease-in-out infinite}
    @keyframes bp{0%,100%{opacity:.2}50%{opacity:1}}
  </style>

  <g class="float">
    <!-- ground glow -->
    <ellipse cx="110" cy="248" rx="60" ry="8" fill="var(--teal)" opacity="0.15" filter="url(#softGlow)"/>
    <!-- shoulders / body -->
    <path d="M60 250 q0 -70 50 -74 q50 4 50 74 Z" fill="var(--surf2)" stroke="var(--teal)" stroke-opacity="0.7"/>
    <circle class="core" cx="110" cy="205" r="6" fill="var(--amber)" filter="url(#glow)"/>
    <line x1="70" y1="170" x2="70" y2="215" stroke="var(--teal)" stroke-width="6" stroke-linecap="round"/><g class="float" style="transform-origin:150px 170px"><line x1="150" y1="170" x2="175" y2="120" stroke="var(--teal)" stroke-width="6" stroke-linecap="round"/><circle cx="177" cy="116" r="6" fill="var(--teal)"/></g>
    <!-- head -->
    <g transform="translate(0,0)">
      <rect x="76" y="70" width="68" height="82" rx="24" fill="var(--surf)" stroke="var(--teal)" stroke-opacity="0.8"/>
      <rect x="76" y="70" width="68" height="82" rx="24" fill="none" stroke="var(--tealg)" stroke-opacity="0.25"/>
      <!-- visor slit -->
      <rect class="visor" x="86" y="100" width="48" height="12" rx="6" fill="var(--teal)" filter="url(#glow)"/>
      <circle class="visor" cx="98" cy="106" r="2.5" fill="var(--bg)"/>
      <circle class="visor" cx="122" cy="106" r="2.5" fill="var(--bg)"/>
      <!-- antenna -->
      <line x1="110" y1="70" x2="110" y2="54" stroke="var(--teal)" stroke-width="2"/>
      <circle class="core" cx="110" cy="50" r="4" fill="var(--amber)" filter="url(#glow)"/>
    </g>
    <text x="150" y="90" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="13" fill="var(--amber)" class="blip">bye</text>
  </g>
</svg>

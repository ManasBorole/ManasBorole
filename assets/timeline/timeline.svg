  <line x1="60" y1="40" x2="60" y2="520" stroke="var(--line)" stroke-width="2"/><line class="ln" x1="60" y1="40" x2="60" y2="520" stroke="var(--teal)" stroke-width="2" filter="url(#glow)"/><circle class="nd" cx="60" cy="60" r="8" fill="var(--bg)" stroke="var(--teal)" stroke-width="2.5" style="animation-delay:-0.0s" filter="url(#glow)"/><circle cx="60" cy="60" r="3" fill="var(--teal)"/><text class="yr" x="100" y="54" fill="var(--teal)">2020</text><text class="tt" x="100" y="76">First lines of code</text><text class="ds" x="100" y="98">B.Tech in AI/ML begins. Curiosity ahead of the syllabus.</text><circle class="nd" cx="60" cy="142" r="8" fill="var(--bg)" stroke="var(--amber)" stroke-width="2.5" style="animation-delay:-0.4s" filter="url(#glow)"/><circle cx="60" cy="142" r="3" fill="var(--amber)"/><text class="yr" x="100" y="136" fill="var(--amber)">2022</text><text class="tt" x="100" y="158">Founder, B&amp;B Fashion</text><text class="ds" x="100" y="180">Ran a real business end to end. Learned what shipping costs.</text><circle class="nd" cx="60" cy="224" r="8" fill="var(--bg)" stroke="var(--amber)" stroke-width="2.5" style="animation-delay:-0.8s" filter="url(#glow)"/><circle cx="60" cy="224" r="3" fill="var(--amber)"/><text class="yr" x="100" y="218" fill="var(--amber)">2023</text><text class="tt" x="100" y="240">Co-founder, Gullak</text><text class="ds" x="100" y="262">Investing platform for first-timers. Owned scope and delivery.</text><circle class="nd" cx="60" cy="306" r="8" fill="var(--bg)" stroke="var(--teal)" stroke-width="2.5" style="animation-delay:-1.2000000000000002s" filter="url(#glow)"/><circle cx="60" cy="306" r="3" fill="var(--teal)"/><text class="yr" x="100" y="300" fill="var(--teal)">2024</text><text class="tt" x="100" y="322">Software Engineer, IQCPL</text><text class="ds" x="100" y="344">Certification and audit platform. Java, Spring, React, Postgres, at scale.</text><circle class="nd" cx="60" cy="388" r="8" fill="var(--bg)" stroke="var(--teal)" stroke-width="2.5" style="animation-delay:-1.6s" filter="url(#glow)"/><circle cx="60" cy="388" r="3" fill="var(--teal)"/><text class="yr" x="100" y="382" fill="var(--teal)">2026</text><text class="tt" x="100" y="404">AI, shipped</text><text class="ds" x="100" y="426">Multiplexer and Christopher live in production. Voice, routing, memory.</text><circle class="nd" cx="60" cy="470" r="8" fill="var(--bg)" stroke="var(--amber)" stroke-width="2.5" style="animation-delay:-2.0s" filter="url(#glow)"/><circle cx="60" cy="470" r="3" fill="var(--amber)"/><text class="yr" x="100" y="464" fill="var(--amber)">Next</text><text class="tt" x="100" y="486">A company of my own</text><text class="ds" x="100" y="508">A team workspace where collaboration and an operational AI agent run as one system.</text>

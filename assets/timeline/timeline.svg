<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering timeline">
  <style>:root{--bg:#0A0E12;--bg2:#0D141A;--surf:#121A20;--surf2:#16232B;--teal:#4CC9C0;--tealg:#7FE9DF;--teald:#2C6E6A;--amber:#E9A85A;--amberg:#F4C889;--text:#E8EEEC;--mute:#7E938C;--line:#20303A}@media(prefers-color-scheme:light){:root{--bg:#F6F8FA;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F5F8;--teal:#0E7C74;--tealg:#0E8C82;--teald:#8FB7B3;--amber:#B9761A;--amberg:#C98A2A;--text:#1F2328;--mute:#57606A;--line:#D0D7DE}.scanpanel{opacity:0}}</style>
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg2)"/>
      <stop offset="1" stop-color="var(--bg)"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)"/>
      <stop offset="1" stop-color="var(--tealg)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="var(--teal)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .yr{font:700 15px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;letter-spacing:2px}
    .tt{font:700 19px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:var(--text)}
    .ds{font:400 13px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:var(--mute)}
    .ln{stroke-dasharray:4 8;animation:m 6s linear infinite}
    @keyframes m{to{stroke-dashoffset:-120}}
    .nd{animation:np 2.6s ease-in-out infinite}
    @keyframes np{0%,100%{opacity:.6}50%{opacity:1}}
  </style>

  <rect width="900" height="560" fill="var(--bg)"/>
  <g class="scanpanel" opacity="0.03"><rect x="0" y="0" width="900" height="1" fill="var(--teal)"/><rect x="0" y="4" width="900" height="1" fill="var(--teal)"/><rect x="0" y="8" width="900" height="1" fill="var(--teal)"/><rect x="0" y="12" width="900" height="1" fill="var(--teal)"/><rect x="0" y="16" width="900" height="1" fill="var(--teal)"/><rect x="0" y="20" width="900" height="1" fill="var(--teal)"/><rect x="0" y="24" width="900" height="1" fill="var(--teal)"/><rect x="0" y="28" width="900" height="1" fill="var(--teal)"/><rect x="0" y="32" width="900" height="1" fill="var(--teal)"/><rect x="0" y="36" width="900" height="1" fill="var(--teal)"/><rect x="0" y="40" width="900" height="1" fill="var(--teal)"/><rect x="0" y="44" width="900" height="1" fill="var(--teal)"/><rect x="0" y="48" width="900" height="1" fill="var(--teal)"/><rect x="0" y="52" width="900" height="1" fill="var(--teal)"/><rect x="0" y="56" width="900" height="1" fill="var(--teal)"/><rect x="0" y="60" width="900" height="1" fill="var(--teal)"/><rect x="0" y="64" width="900" height="1" fill="var(--teal)"/><rect x="0" y="68" width="900" height="1" fill="var(--teal)"/><rect x="0" y="72" width="900" height="1" fill="var(--teal)"/><rect x="0" y="76" width="900" height="1" fill="var(--teal)"/><rect x="0" y="80" width="900" height="1" fill="var(--teal)"/><rect x="0" y="84" width="900" height="1" fill="var(--teal)"/><rect x="0" y="88" width="900" height="1" fill="var(--teal)"/><rect x="0" y="92" width="900" height="1" fill="var(--teal)"/><rect x="0" y="96" width="900" height="1" fill="var(--teal)"/><rect x="0" y="100" width="900" height="1" fill="var(--teal)"/><rect x="0" y="104" width="900" height="1" fill="var(--teal)"/><rect x="0" y="108" width="900" height="1" fill="var(--teal)"/><rect x="0" y="112" width="900" height="1" fill="var(--teal)"/><rect x="0" y="116" width="900" height="1" fill="var(--teal)"/><rect x="0" y="120" width="900" height="1" fill="var(--teal)"/><rect x="0" y="124" width="900" heigh
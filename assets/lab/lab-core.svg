<svg viewBox="0 0 470 182" width="470" height="182" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Core &amp; Languages stack">
  <style>:root{--bg:#0A0E12;--bg2:#0D141A;--surf:#121A20;--surf2:#16232B;--teal:#4CC9C0;--tealg:#7FE9DF;--teald:#2C6E6A;--amber:#E9A85A;--amberg:#F4C889;--text:#E8EEEC;--mute:#7E938C;--line:#20303A}@media(prefers-color-scheme:light){:root{--bg:#F6F8FA;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F5F8;--teal:#0E7C74;--tealg:#0E8C82;--teald:#8FB7B3;--amber:#B9761A;--amberg:#C98A2A;--text:#1F2328;--mute:#57606A;--line:#D0D7DE}.scanpanel{opacity:0}}</style>
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bg2)"/>
      <stop offset="1" stop-color="var(--bg)"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)"/>
      <stop offset="1" stop-color="var(--tealg)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teal)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="var(--teal)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .h{font:700 18px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:1px;fill:var(--text)}
    .k{font:600 11px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;letter-spacing:4px;fill:var(--teal)}
    .it{font:500 14px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;fill:var(--mute)}
    .dot{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
  </style>

  <rect x="1" y="1" width="468" height="180" rx="14" fill="var(--surf)" stroke="var(--line)"/>
  <rect x="1" y="1" width="468" height="180" rx="14" fill="url(#bgGrad)" opacity="0.4"/>
  <g class="scanpanel" opacity="0.04"><rect x="0" y="0" width="470" height="1" fill="var(--teal)"/><rect x="0" y="4" width="470" height="1" fill="var(--teal)"/><rect x="0" y="8" width="470" height="1" fill="var(--teal)"/><rect x="0" y="12" width="470" height="1" fill="var(--teal)"/><rect x="0" y="16" width="470" height="1" fill="var(--teal)"/><rect x="0" y="20" width="470" height="1" fill="var(--teal)"/><rect x="0" y="24" width="470" height="1" fill="var(--teal)"/><rect x="0" y="28" width="470" height="1" fill="var(--teal)"/><rect x="0" y="32" width="470" height="1" fill="var(--teal)"/><rect x="0" y="36" width="470" height="1" fill="var(--teal)"/><rect x="0" y="40" width="470" height="1" fill="var(--teal)"/><rect x="0" y="44" width="470" height="1" fill="var(--teal)"/><rect x="0" y="48" width="470" height="1" fill="var(--teal)"/><rect x="0" y="52" width="470" height="1" fill="var(--teal)"/><rect x="0" y="56" width="470" height="1" fill="var(--teal)"/><rect x="0" y="60" width="470" height="1" fill="var(--teal)"/><rect x="0" y="64" width="470" height="1" fill="var(--teal)"/><rect x="0" y="68" width="470" height="1" fill="var(--teal)"/><rect x="0" y="72" width="470" height="1" fill="var(--teal)"/><rect x="0" y="76" width="470" height="1" fill="var(--teal)"/><rect x="0" y="80" width="470" height="1" fill="var(--teal)"/><rect x="0" y="84" width="470" height="1" fill="var(--teal)"/><rect x="0" y="88" width="470" height="1" fill="var(--teal)"/><rect x="0" y="92" width="470" height="1" fill="var(--teal)"/><rect x="0" y="96" width="470" height="1" fill="var(--teal)"/><rect x="0" y="100" width="470" height="1" fill="var(--teal)"/><rect x="0" y="104" width="470" height="1" fill="var(--teal)"/><rect x="0" y="108" width="470" height="1" fill="var(--teal)"/><rect x="0" y="112" width="470" height="1" fill="var(--teal)"/><rect x="0" y="116" width="470" height="1" fill="var(--teal)"/><rect x="0" y="120" width="470" height="1" fill="var(--teal)"/><rect x="0" y="124" width="470" height="1" fill="var(--teal)"/><rect x="0" y="128" width="470" height="1" fill="var(--teal)"/><rect x="0" y="132" width="470" height="1" fill="var(--teal)"/><rect x="0" y="136" width="470" height="1" fill="var(--teal)"/><rect x="0" y="140" width="470" height="1" fill="var(--teal)"/><rect x="0" y="144" width="470" height="1" fill="var(--teal)"/><rect x="0" y="148" width="470" height="1" fill="var(--teal)"/><rect x="0" y="152" width="470" height="1" fill="var(--teal)"/><rect x="0" y="156" width="470" height="1" fill="var(--teal)"/><rect x="0" y="160" width="470" height="1" fill="var(--teal)"/><rect x="0" y="164" width="470" height="1" fill="var(--teal)"/><rect x="0" y="168" width="470" height="1" fill="var(--teal)"/><rect x="0" y="172" width="470" height="1" fill="var(--teal)"/><rect x="0" y="176" width="470" height="1" fill="var(--teal)"/><rect x="0" y="180" width="470" height="1" fill="var(--teal)"/></g>
  <rect x="0" y="0" width="4" height="182" fill="var(--teal)" filter="url(#glow)"/>
  <text class="k" x="30" y="36">LAB // CORE</text>
  <text class="h" x="28" y="66" filter="url(#glow)">Core &amp; Languages</text>
  <line x1="28" y1="82" x2="440" y2="82" stroke="var(--line)"/>
  <circle class="dot" cx="34" cy="104" r="3" fill="var(--teal)" style="animation-delay:-0.0s"/><text class="it" x="46" y="108">TypeScript</text><circle class="dot" cx="249" cy="104" r="3" fill="var(--teal)" style="animation-delay:-0.4s"/><text class="it" x="261" y="108">JavaScript</text><circle class="dot" cx="34" cy="134" r="3" fill="var(--teal)" style="animation-delay:-0.8s"/><text class="it" x="46" y="138">Java</text><circle class="dot" cx="249" cy="134" r="3" fill="var(--teal)" style="animation-delay:-1.2000000000000002s"/><text class="it" x="261" y="138">Python</text><circle class="dot" cx="34" cy="164" r="3" fill="var(--teal)" style="animation-delay:-1.6s"/><text class="it" x="46" y="168">SQL</text><circle class="dot" cx="249" cy="164" r="3" fill="var(--teal)" style="animation-delay:-0.0s"/><text class="it" x="261" y="168">Node.js</text>
</svg>

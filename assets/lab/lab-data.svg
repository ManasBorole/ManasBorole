<svg viewBox="0 0 470 152" width="470" height="152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Databases stack">
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D141A"/>
      <stop offset="1" stop-color="#0A0E12"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9C0"/>
      <stop offset="1" stop-color="#7FE9DF"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9C0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4CC9C0" stop-opacity="1"/>
      <stop offset="1" stop-color="#E9A85A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <style>
    .h{font:700 18px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:1px;fill:#E8EEEC}
    .k{font:600 11px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;letter-spacing:4px;fill:#4CC9C0}
    .it{font:500 14px ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace;fill:#7E938C}
    .dot{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
  </style>

  <rect x="1" y="1" width="468" height="150" rx="14" fill="#121A20" stroke="#20303A"/>
  <rect x="1" y="1" width="468" height="150" rx="14" fill="url(#bgGrad)" opacity="0.4"/>
